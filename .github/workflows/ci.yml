name: Clinic Release CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t clinic-release-lab:ci .

      - name: Start the container
        run: |
          docker run -d --name clinic-release-ci \
            -p 127.0.0.1:8091:80 clinic-release-lab:ci

      - name: Verify the health endpoint and homepage
        run: |
          health_body=$(curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --max-time 5 \
            http://127.0.0.1:8091/healthz)

          if [ "$health_body" != "ok" ]; then
            printf 'Expected /healthz to return ok, got <%s>\n' "$health_body"
            exit 1
          fi

          curl --fail --silent --show-error \
            http://127.0.0.1:8091/ > homepage.html
          grep -F 'Release v1 is running.' homepage.html

      - name: Show container logs if the job fails
        if: failure()
        run: docker logs clinic-release-ci