name: Clinic Release CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t clinic-release-lab:ci .

      - name: Start the container
        run: |
          docker run -d --name clinic-release-ci \
            -p 127.0.0.1:8091:80 clinic-release-lab:ci

      - name: Verify the health endpoint and homepage
        run: |
          health_body=$(curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --max-time 5 \
            http://127.0.0.1:8091/healthz)

          if [ "$health_body" != "ok" ]; then
            printf 'Expected /healthz to return ok, got <%s>\n' "$health_body"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:8091/ > homepage.html
          grep -F 'Release v1 is running.' homepage.html

      - name: Show container logs on failure
        if: failure()
        run: docker logs clinic-release-ci

  kubernetes-rollout:
    needs: smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Create a temporary Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: clinic-ci

      - name: Build and load the app image
        run: |
          docker build -t clinic-release-lab:v1 .
          kind load docker-image clinic-release-lab:v1 --name clinic-ci

      - name: Apply the manifest and verify the rollout
        run: |
          kubectl --context kind-clinic-ci apply -f k8s/app.yaml
          kubectl --context kind-clinic-ci -n clinic-release \
            rollout status deployment/clinic-release --timeout=90s

      - name: Verify the app through the Kubernetes Service
        run: |
          kubectl --context kind-clinic-ci -n clinic-release run clinic-smoke \
            --rm -i --restart=Never --image=busybox:1.37 \
            --pod-running-timeout=90s \
            --command -- sh -ec '
              body=$(wget -qO- -T 5 http://clinic-release/healthz)
              if [ "$body" != "ok" ]; then
                printf "Expected ok from the Service, got <%s>\n" "$body"
                exit 1
              fi
              printf "Service health check passed: %s\n" "$body"
            '

      - name: Show Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-clinic-ci -n clinic-release get pods -o wide || true
          kubectl --context kind-clinic-ci -n clinic-release get events \
            --sort-by=.lastTimestamp || true