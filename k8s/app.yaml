apiVersion: v1
kind: Namespace
metadata:
  name: clinic-release
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-release
  namespace: clinic-release
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinic-release
  template:
    metadata:
      labels:
        app: clinic-release
    spec:
      containers:
        - name: clinic
          image: clinic-release-lab:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz-broken
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clinic-release
  namespace: clinic-release
spec:
  type: ClusterIP
  selector:
    app: clinic-release
  ports:
    - name: http
      port: 80
      targetPort: http
